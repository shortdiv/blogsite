[build]
publish = "public"
command = "sh scripts/fetch-fonts.sh && hugo"

[context.production.environment]
HUGO_VERSION = "0.152.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "sh scripts/fetch-fonts.sh && hugo --enableGitInfo"

[context.split1.environment]
HUGO_VERSION = "0.152.0"
HUGO_ENV = "production"

[context.deploy-preview]
command = "sh scripts/fetch-fonts.sh && hugo -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.152.0"

[context.branch-deploy]
command = "sh scripts/fetch-fonts.sh && hugo -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.152.0"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"


[[plugins]]
package = "./plugins/fonts-cache"
