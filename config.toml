baseURL = "https://shortdiv.com/"
languageCode = "en-us"
title = "<shortdiv />"
theme = "PaperMod"

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  paginate = 5
  ShowReadingTime = true
  description = "Divya's blog on infra, web, and software engineering"

[params.social]
  twitter = "shortdiv"
  linkedin = "shortdiv"
  feed="/index.xml"

[params.homeInfoParams]
  Title = "Hi, I'm Div 👋"
  image = "/images/divspeaking.jpg"
  Content = "I write about infrastructure, observability, and building with agents. I also help early-stage teams with the work between engineering and growth. [Work with me →](/hire/)"

[params.assets]
  favicon = "/favicon/favicon.ico"

hideAuthor = true

[[menu.main]]
  name = "Writing"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Work"
  url = "/work/"
  weight = 2

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 3


# Lets markdown blocks take a class, e.g. `{.help-list}` after a list (used on /hire).
[markup.goldmark.parser.attribute]
  block = true
